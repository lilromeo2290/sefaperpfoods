<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D5A3"/>
      <stop offset="0.4" stop-color="#D4AF37"/>
      <stop offset="0.7" stop-color="#C5A059"/>
      <stop offset="1" stop-color="#B8943D"/>
    </linearGradient>
    <linearGradient id="goldGradHorz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8943D"/>
      <stop offset="0.5" stop-color="#E8D5A3"/>
      <stop offset="1" stop-color="#B8943D"/>
    </linearGradient>
    <linearGradient id="burgundyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7A1F26"/>
      <stop offset="1" stop-color="#5A1419"/>
    </linearGradient>
    <radialGradient id="creamBg" cx="50%" cy="40%" r="65%">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F5EFE3"/>
    </radialGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="400" cy="400" r="400" fill="url(#creamBg)"/>

  <!-- Outer gold ring -->
  <circle cx="400" cy="400" r="380" fill="none" stroke="url(#goldGradHorz)" stroke-width="3"/>
  <circle cx="400" cy="400" r="368" fill="none" stroke="url(#goldGradHorz)" stroke-width="1.5"/>

  <!-- Laurel wreath (left side) -->
  <g transform="translate(400 400)">
    <g>
      <!-- Left laurel branch -->
      <path d="M -200 -50 Q -260 -100 -290 -180" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
      <g fill="url(#goldGrad)">
        <ellipse cx="-220" cy="-70" rx="14" ry="6" transform="rotate(-30 -220 -70)"/>
        <ellipse cx="-245" cy="-100" rx="14" ry="6" transform="rotate(-45 -245 -100)"/>
        <ellipse cx="-265" cy="-135" rx="14" ry="6" transform="rotate(-55 -265 -135)"/>
        <ellipse cx="-280" cy="-170" rx="14" ry="6" transform="rotate(-65 -280 -170)"/>
        <ellipse cx="-205" cy="-90" rx="14" ry="6" transform="rotate(-15 -205 -90)"/>
        <ellipse cx="-225" cy="-125" rx="14" ry="6" transform="rotate(-25 -225 -125)"/>
        <ellipse cx="-245" cy="-160" rx="14" ry="6" transform="rotate(-35 -245 -160)"/>
      </g>
      <!-- Right laurel branch -->
      <path d="M 200 -50 Q 260 -100 290 -180" stroke="url(#goldGrad)" stroke-width="3" fill="none"/>
      <g fill="url(#goldGrad)">
        <ellipse cx="220" cy="-70" rx="14" ry="6" transform="rotate(30 220 -70)"/>
        <ellipse cx="245" cy="-100" rx="14" ry="6" transform="rotate(45 245 -100)"/>
        <ellipse cx="265" cy="-135" rx="14" ry="6" transform="rotate(55 265 -135)"/>
        <ellipse cx="280" cy="-170" rx="14" ry="6" transform="rotate(65 280 -170)"/>
        <ellipse cx="205" cy="-90" rx="14" ry="6" transform="rotate(15 205 -90)"/>
        <ellipse cx="225" cy="-125" rx="14" ry="6" transform="rotate(25 225 -125)"/>
        <ellipse cx="245" cy="-160" rx="14" ry="6" transform="rotate(35 245 -160)"/>
      </g>
    </g>

    <!-- The big S letterform (burgundy) -->
    <path d="M -40 -120 C -100 -120 -130 -90 -130 -50 C -130 -10 -90 10 -40 10 C 10 10 40 30 40 70 C 40 110 10 130 -50 130 C -100 130 -130 110 -140 80" 
          stroke="url(#burgundyGrad)" stroke-width="48" fill="none" stroke-linecap="round"/>
    <!-- Serif accents on S -->
    <circle cx="-130" cy="-100" r="8" fill="url(#burgundyGrad)"/>
    <circle cx="-130" cy="100" r="8" fill="url(#burgundyGrad)"/>

    <!-- Cloche (food dome) on right -->
    <g transform="translate(110 -30)">
      <!-- Dome -->
      <path d="M -45 30 Q -45 -30 0 -45 Q 45 -30 45 30 Z" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="1"/>
      <!-- Knob -->
      <circle cx="0" cy="-50" r="6" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="1"/>
      <!-- Base plate -->
      <rect x="-55" y="28" width="110" height="6" rx="2" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.5"/>
      <!-- Highlight on dome -->
      <path d="M -30 10 Q -30 -20 -5 -32" stroke="#F5E6B8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.7"/>
    </g>

    <!-- Serving hand at bottom -->
    <g transform="translate(60 140)">
      <!-- Palm -->
      <path d="M -45 0 Q -50 -20 -30 -25 L 30 -25 Q 50 -20 45 0 L 40 15 Q 30 25 0 25 Q -30 25 -40 15 Z" 
            fill="url(#goldGrad)" stroke="#8B6914" stroke-width="1"/>
      <!-- Fingers -->
      <ellipse cx="-30" cy="-18" rx="6" ry="12" fill="url(#goldGrad)"/>
      <ellipse cx="-15" cy="-22" rx="6" ry="14" fill="url(#goldGrad)"/>
      <ellipse cx="0" cy="-24" rx="6" ry="14" fill="url(#goldGrad)"/>
      <ellipse cx="15" cy="-22" rx="6" ry="14" fill="url(#goldGrad)"/>
      <ellipse cx="30" cy="-18" rx="6" ry="12" fill="url(#goldGrad)"/>
      <!-- Thumb -->
      <ellipse cx="-42" cy="0" rx="8" ry="6" transform="rotate(-30 -42 0)" fill="url(#goldGrad)"/>
      <!-- Cuff -->
      <rect x="-25" y="20" width="50" height="8" rx="2" fill="url(#goldGrad)" stroke="#8B6914" stroke-width="0.5"/>
    </g>
  </g>

  <!-- Company name - bold display text -->
  <text x="400" y="640" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="56" font-weight="800" fill="url(#burgundyGrad)" letter-spacing="1">SEFAKOR</text>
  <text x="400" y="690" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="36" font-weight="600" fill="url(#goldGradHorz)" letter-spacing="8">FOODS</text>

  <!-- Decorative divider -->
  <g transform="translate(400 715)">
    <line x1="-80" y1="0" x2="-15" y2="0" stroke="url(#goldGradHorz)" stroke-width="1"/>
    <circle cx="0" cy="0" r="3" fill="url(#goldGrad)"/>
    <line x1="15" y1="0" x2="80" y2="0" stroke="url(#goldGradHorz)" stroke-width="1"/>
  </g>

  <!-- Tagline -->
  <text x="400" y="755" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-style="italic" fill="#6B1C23" letter-spacing="3">Quality · Taste · Trust</text>
</svg>
