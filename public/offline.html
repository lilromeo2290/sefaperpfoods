<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>SBF Foods — Offline</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#FFF8E1;color:#3E2723;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:1.5rem;text-align:center}
  .card{max-width:420px;background:#fff;border:1px solid #E8D9B5;border-radius:18px;padding:2.5rem;box-shadow:0 20px 40px -20px rgba(93,64,55,.25)}
  h1{margin:0 0 .5rem;color:#5D4037;font-size:1.6rem}
  p{margin:.4rem 0;color:#7B5E4F;line-height:1.55}
  .gold{color:#B8941F;font-weight:700}
  button{margin-top:1.2rem;background:#5D4037;color:#FFF8E1;border:0;padding:.75rem 1.5rem;border-radius:999px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
  <div class="card">
    <div style="font-size:3rem">🛒</div>
    <h1>You're offline</h1>
    <p>SBF Foods can't reach the internet right now, but your cart and recent orders are still available.</p>
    <p class="gold">Authentic Ghanaian Taste — Delivered Fresh.</p>
    <button onclick="location.href='/'">Try again</button>
  </div>
</body>
</html>
