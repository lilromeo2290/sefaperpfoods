<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7A1F26"/>
      <stop offset="1" stop-color="#4A0F14"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E8D5A3"/>
      <stop offset="0.5" stop-color="#D4AF37"/>
      <stop offset="1" stop-color="#B8943D"/>
    </linearGradient>
    <linearGradient id="goldHorz" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B8943D"/>
      <stop offset="0.5" stop-color="#E8D5A3"/>
      <stop offset="1" stop-color="#B8943D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Top gold ring -->
  <circle cx="256" cy="200" r="130" fill="none" stroke="url(#goldHorz)" stroke-width="3"/>
  <circle cx="256" cy="200" r="124" fill="none" stroke="url(#goldHorz)" stroke-width="1.5"/>
  <!-- S letterform -->
  <g transform="translate(256 200)">
    <path d="M -25 -75 C -65 -75 -85 -55 -85 -30 C -85 -5 -55 5 -25 5 C 5 5 25 18 25 45 C 25 70 5 80 -30 80 C -60 80 -80 70 -85 50"
          stroke="url(#goldGrad)" stroke-width="30" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Mini cloche -->
  <g transform="translate(310 175)">
    <path d="M -28 18 Q -28 -18 0 -28 Q 28 -18 28 18 Z" fill="url(#goldGrad)"/>
    <circle cx="0" cy="-32" r="4" fill="url(#goldGrad)"/>
    <rect x="-32" y="17" width="64" height="4" rx="1.5" fill="url(#goldGrad)"/>
  </g>
  <!-- Wordmark -->
  <text x="256" y="400" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="58" font-weight="800" fill="url(#goldHorz)" letter-spacing="2">SEFAKOR</text>
  <text x="256" y="445" text-anchor="middle" font-family="Playfair Display, Georgia, serif" font-size="24" font-weight="600" fill="#E8D5A3" letter-spacing="12">FOODS</text>
  <!-- Tagline with divider -->
  <g transform="translate(256 475)">
    <line x1="-90" y1="0" x2="-15" y2="0" stroke="url(#goldHorz)" stroke-width="1"/>
    <text x="0" y="5" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-style="italic" fill="#E8D5A3" letter-spacing="2">Quality · Taste · Trust</text>
    <line x1="15" y1="0" x2="90" y2="0" stroke="url(#goldHorz)" stroke-width="1"/>
  </g>
</svg>
